
# Configuration version (required)
version: 1.2.2
fileStrategy: "s3"

# Cache settings: Set to true to enable caching
cache: true

# Per-user spend guardrail (flat-fee protection).
# Credits are denominated in provider list price: 1,000,000 credits = $1 of
# token cost. Expensive models drain faster via per-model multipliers
# (packages/data-schemas tx.ts tokenValues). Users are hard-stopped at 0.
# 20,000,000 credits = $20/month of API cost per user (~4x the plan price;
# generous for real use, fatal to abuse). Refills lazily on login/refresh.
balance:
  enabled: true
  startBalance: 20000000
  autoRefillEnabled: true
  refillIntervalValue: 30
  refillIntervalUnit: 'days'
  refillAmount: 20000000

# Custom interface configuration
interface:
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: true
  speechTab: true

speech:
  speechTab:
    conversationMode: true
    advancedMode: false
    speechToText: true
    textToSpeech: true
  tts:
    openai:
      apiKey: '${TTS_API_KEY}'
      model: 'tts-1'
      voices: ['alloy', 'echo', 'fable', 'onyx', 'nova', 'shimmer']
  stt:
    openai:
      apiKey: '${STT_API_KEY}'
      model: 'whisper-1'

mcpServers:
  SequentialThinking:
    type: stdio
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-sequential-thinking"
    timeout: 30000
    initTimeout: 10000
    env:
      NODE_ENV: "production"
    stderr: inherit

# Add this to your librechat.yaml
ocr:
  strategy: "mistral_ocr"  # or "azure_mistral_ocr" or "vertexai_mistral_ocr"
  apiKey: "${OCR_API_KEY}"
  baseURL: "${OCR_BASEURL}"
  mistralModel: "mistral-ocr-latest"  # optional, this is the default

endpoints:
  agents:
    recursionLimit: 50
    disableBuilder: false
    # (optional) Agent Capabilities available to all users. Omit the ones you wish to exclude. Defaults to list below.
    # capabilities: ["execute_code", "file_search", "actions", "tools"]
  custom:
    - name: 'huggingface'
      apiKey: '${HUGGINGFACE_API_KEY}'
      baseURL: 'https://router.huggingface.co/v1/'
      models: # https://huggingface.co/models
        default:
          - 'mistralai/Mixtral-8x7B-Instruct-v0.1'
          - 'zai-org/GLM-5'
          - 'moonshotai/Kimi-K2.5'
          - 'MiniMaxAI/MiniMax-M2.5'
          - 'Qwen/QwQ-32B'
          - 'openai/gpt-oss-120b'
        fetch: false
      titleConvo: true
      titleModel: 'moonshotai/Kimi-K2.5'
      modelDisplayLabel: 'HuggingFace'

    # FIREWORKS-ENDPOINT:START — auto-generated by scripts/update-fireworks-models.mjs
    # (weekly via .github/workflows/update-fireworks-models.yml). Edit the script,
    # not this block; manual edits will be overwritten.
    - name: 'Fireworks'
      apiKey: '${FIREWORKS_API_KEY}'
      baseURL: 'https://api.fireworks.ai/inference/v1'
      models:
        # Top trending serverless LLMs from https://app.fireworks.ai/models (Sort: Trending).
        # Snapshot: 2026-08-22
        default: [
          "accounts/fireworks/models/deepseek-v4-pro-0813",
          "accounts/fireworks/models/muse-glimmer-30b",
          "accounts/fireworks/models/nemotron-lightning-3p5-30b-a3b",
          "accounts/fireworks/models/qwen3p8-max",
          "accounts/fireworks/models/deepseek-v4-flash-0731",
          "accounts/fireworks/models/kimi-k3",
          "accounts/fireworks/models/glm-5p2",
          "accounts/fireworks/models/kimi-k2p7-code",
          "accounts/fireworks/models/minimax-m3",
          "accounts/fireworks/models/deepseek-v4-pro",
          "accounts/fireworks/models/gpt-oss-120b",
          "accounts/fireworks/models/gpt-oss-20b",
          "accounts/fireworks/models/nemotron-3-ultra-nvfp4",
          "accounts/fireworks/models/inkling",
          "accounts/fireworks/models/qwen3p7-plus",
          "accounts/fireworks/models/kimi-k2p6",
          "accounts/fireworks/models/minimax-m2p7"
        ]
        fetch: false
      titleConvo: true
      titleModel: "accounts/fireworks/models/deepseek-v4-flash-0731"
      summarize: false
      modelDisplayLabel: 'Fireworks'
    # FIREWORKS-ENDPOINT:END

    # APIpie
    # https://apipie.ai/dashboard/
    # Script to fetch models: https://github.com/LibreChat-AI/librechat-config-yaml/blob/main/scripts/apipie.py
    # - name: "APIpie"
    #   apiKey: "${APIPIE_API_KEY}"
    #   baseURL: "https://apipie.ai/v1/"
    #   models:
    #     default: [
    #       ]
    #     fetch: false
    #   titleConvo: true
    #   titleModel: "claude-4-5-haiku"
    #   summarize: false
    #   summaryModel: "claude-4-5-haiku"
    #   dropParams: ["stream"]
    #   modelDisplayLabel: "APIpie"
    #   iconURL: "https://raw.githubusercontent.com/webpug/PugChat/main/icons/aetherIcon1.png"

    # deepseek
    # https://platform.deepseek.com/api_keys
    # Model list: https://platform.deepseek.com/api-docs/pricing
    - name: "deepseek"
      apiKey: "${DEEPSEEK_API_KEY}"
      baseURL: "https://api.deepseek.com"
      models:
        default: [
          "deepseek-v4-flash",
          "deepseek-v4-pro"
          ]
        fetch: false
      titleConvo: true
      titleModel: "deepseek-v4-flash"
      summarize: false
      summaryModel: "deepseek-v4-pro"
      modelDisplayLabel: "DeepSeek"

    # Preplexity
    # Model list: https://docs.perplexity.ai/docs/model-cards
    - name: "Perplexity"
      apiKey: "${PERPLEXITY_API_KEY}"
      baseURL: "https://api.perplexity.ai/"
      models:
        default: [
          "sonar-deep-research",
          "sonar-reasoning-pro",
          "sonar-pro",
          "sonar"
          ]
        fetch: false # fetching list of models is not supported
      titleConvo: true
      titleModel: "sonar-pro"
      summarize: false
      summaryModel: "sonar-pro"
      forcePrompt: false
      dropParams: ["stop", "frequency_penalty"]
      modelDisplayLabel: "Perplexity"
    - name: "Grok"
      apiKey: "${GROK_API_KEY}"
      baseURL: "https://api.x.ai/v1"
      models:
        default: [
          "grok-4.5",
          "grok-imagine-image-quality"
        ]
        fetch: false
      titleConvo: true
      titleModel: "grok-4.3"
      summarize: false
      summaryModel: "grok-4.3"
      modelDisplayLabel: "Grok"
      iconURL: "https://raw.githubusercontent.com/webpug/PugChat/main/icons/xAIlogo.png"

    # OpenAI GPT-5.6 (Sol/Terra/Luna).
    # GPT-5.6 is a reasoning model: OpenAI rejects function tools on
    # /v1/chat/completions for it ("400 ... use /v1/responses or set
    # reasoning_effort to 'none'"). LibreChat only auto-switches to the
    # Responses API when an explicit reasoning_effort is set, so tool calls
    # otherwise fail. Hosting these models on a dedicated endpoint that forces
    # `useResponsesApi: true` routes every request through /v1/responses, where
    # reasoning + function tools are supported. Points at first-party OpenAI.
    - name: "GPT-5.6"
      apiKey: "${OPENAI_API_KEY}"
      baseURL: "https://api.openai.com/v1"
      models:
        default: [
          "gpt-5.6-sol",
          "gpt-5.6-luna",
          "gpt-5.6-terra"
        ]
        fetch: false
      titleConvo: true
      titleModel: "gpt-5.6-terra"
      modelDisplayLabel: "OpenAI"
      iconURL: "openAI"
      addParams:
        useResponsesApi: true

